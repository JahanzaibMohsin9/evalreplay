name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # CarryPay's agent, offline: its recorded decisions replayed in its sandbox (no API key)
      - name: Example, CarryPay
        working-directory: examples/carrypay
        run: |
          pnpm run fetch
          pnpm run eval --compare baseline

      # and a broken tool must fail the run
      - name: Example, CarryPay with a broken tool
        working-directory: examples/carrypay
        run: |
          if pnpm run eval:broken --compare baseline; then
            echo "expected the broken verify_beneficiary tool to fail the run"
            exit 1
          fi
