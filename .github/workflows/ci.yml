name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # GitHub runs the action from the committed dist/, so it must match the source
      - name: Action dist is up to date
        run: git diff --exit-code -- packages/github-action/dist || (echo "run pnpm build and commit packages/github-action/dist" && exit 1)

  # CarryPay's agent, offline: its recorded decisions replayed in its sandbox (no API key), run
  # through this repository's own action, which comments on the pull request
  carrypay-example:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Fetch CarryPay
        working-directory: examples/carrypay
        run: pnpm run fetch

      - name: Run the cases
        uses: ./
        with:
          working-directory: examples/carrypay

      # and a broken tool must fail the run
      - name: Run the cases with a broken tool
        working-directory: examples/carrypay
        run: |
          if pnpm run eval:broken --compare baseline; then
            echo "expected the broken verify_beneficiary tool to fail the run"
            exit 1
          fi
